[package]
name = "ar1s_launcher"
version = "0.9.1"
description = "Ar1s Launcher"
authors = ["JDBeWL"]
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[lib]
# 不加 _lib 后缀会和 bin 同名，Windows 上冲突
name = "ar1s_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
uuid = { version = "1.28", features = ["v3"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
reqwest = { version = "0.13", features = ["json", "form", "query", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.23"
serde_urlencoded = "0.7"
rand = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
zip = "9.0"
thiserror = "2"
log = "0.4"
fern = "0.7"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
sysinfo = "0.39"
opener = "0.9"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

